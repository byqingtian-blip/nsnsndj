<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>转刀割草 - 商业版原型</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; touch-action: none; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .hud-top { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .xp-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: #444; }
        .xp-bar { height: 100%; background: #00ff00; width: 0%; transition: width 0.2s; }
        #level-text { position: absolute; top: 15px; right: 20px; color: yellow; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        #game-over { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white; pointer-events: auto; }
        button { padding: 15px 30px; font-size: 20px; background: #ff9900; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; box-shadow: 0 4px 0 #cc7a00; }
        button:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 层 -->
    <div id="ui-layer">
        <div class="xp-bar-container"><div class="xp-bar" id="xpBar"></div></div>
        <div class="hud-top">击杀数: <span id="score">0</span></div>
        <div id="level-text">Lv.1</div>
        
        <div id="game-over">
            <h1 style="font-size: 50px; text-shadow: 3px 3px 0 #000; margin-bottom: 20px;">游戏结束</h1>
            <p id="final-score" style="font-size: 24px; margin-bottom: 30px;">最终得分: 0</p>
            <button onclick="restartGame()">重新开始</button>
        </div>
    </div>

<script>
/**
 * 商业级小游戏核心逻辑 - 极简版
 * 包含：渲染循环、碰撞检测、对象池概念、升级系统
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const xpBarEl = document.getElementById('xpBar');
const levelTextEl = document.getElementById('level-text');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');

// 适配屏幕
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- 游戏配置 ---
const CONFIG = {
    playerSpeed: 3, // 玩家移动速度（此处设为0，改为跟随鼠标/触摸，或者自动）
    enemyBaseSpeed: 1.5,
    knifeSpeed: 0.15, // 旋转速度
    spawnRate: 60, // 敌人生成频率（帧数）
};

// --- 游戏状态 ---
let gameState = {
    isRunning: true,
    score: 0,
    level: 1,
    xp: 0,
    xpToNextLevel: 10,
    frames: 0,
    entities: {
        player: null,
        knives: [],
        enemies: [],
        gems: [] // 经验宝石
    }
};

// --- 类定义 ---

class Player {
    constructor() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.radius = 20;
        this.color = '#3498db';
        this.hp = 100;
        this.maxHp = 100;
        // 武器属性
        this.knifeCount = 3;
        this.knifeDistance = 80;
        this.angleOffset = 0;
    }

    update(inputX, inputY) {
        // 简单的平滑移动逻辑 (向触摸点移动)
        if (inputX !== null) {
            const dx = inputX - this.x;
            const dy = inputY - this.y;
            this.x += dx * 0.1; 
            this.y += dy * 0.1;
        }

        // 边界限制
        this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

        // 旋转武器角度
        this.angleOffset += CONFIG.knifeSpeed;
    }

    draw() {
        // 绘制玩家 (用圆形代替)
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.closePath();

        // 绘制血条
        const hpPercent = this.hp / this.maxHp;
        ctx.fillStyle = 'red';
        ctx.fillRect(this.x - 20, this.y + 30, 40, 5);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(this.x - 20, this.y + 30, 40 * hpPercent, 5);
    }
}

class Knife {
    constructor(owner, index, total) {
        this.owner = owner;
        this.index = index;
        this.total = total;
        this.radius = 8;
        this.damage = 10;
    }

    getPosition() {
        const angle = this.owner.angleOffset + (Math.PI * 2 / this.total) * this.index;
        return {
            x: this.owner.x + Math.cos(angle) * this.owner.knifeDistance,
            y: this.owner.y + Math.sin(angle) * this.owner.knifeDistance
        };
    }

    draw() {
        const pos = this.getPosition();
        ctx.save();
        ctx.translate(pos.x, pos.y);
        // 计算旋转角度让刀尖朝外
        const angle = this.owner.angleOffset + (Math.PI * 2 / this.total) * this.index;
        ctx.rotate(angle);
        
        // 绘制飞刀形状
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-5, 5);
        ctx.lineTo(-5, -5);
        ctx.closePath();
        ctx.fillStyle = '#f1c40f'; // 金色飞刀
        ctx.fill();
        
        ctx.restore();
    }
}

class Enemy {
    constructor() {
        // 从屏幕边缘随机生成
        if (Math.random() < 0.5) {
            this.x = Math.random() < 0.5 ? -20 : canvas.width + 20;
            this.y = Math.random() * canvas.height;
        } else {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() < 0.5 ? -20 : canvas.height + 20;
        }
        
        this.radius = 15;
        this.speed = CONFIG.enemyBaseSpeed + (gameState.level * 0.1); // 随等级变快
        this.hp = 20 + (gameState.level * 5);
        this.color = '#e74c3c';
    }

    update(targetX, targetY) {
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.stroke();
        ctx.closePath();
    }
}

class Gem {
    constructor(x, y, value) {
        this.x = x;
        this.y = y;
        this.value = value;
        this.radius = 6;
        this.magnetized = false;
    }

    update(playerX, playerY) {
        const dx = playerX - this.x;
        const dy = playerY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // 磁吸效果
        if (dist < 100) this.magnetized = true;

        if (this.magnetized) {
            this.x += (dx / dist) * 8; // 快速飞向玩家
            this.y += (dy / dist) * 8;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#2ecc71'; // 绿色经验球
        ctx.fill();
        ctx.closePath();
    }
}

// --- 输入处理 ---
let inputX = null;
let inputY = null;

// 触摸/鼠标移动控制
window.addEventListener('touchmove', e => {
    e.preventDefault();
    inputX = e.touches[0].clientX;
    inputY = e.touches[0].clientY;
}, {passive: false});

window.addEventListener('mousemove', e => {
    inputX = e.clientX;
    inputY = e.clientY;
});

// --- 游戏主循环 ---

function initGame() {
    gameState.isRunning = true;
    gameState.score = 0;
    gameState.level = 1;
    gameState.xp = 0;
    gameState.xpToNextLevel = 10;
    gameState.frames = 0;
    
    gameState.entities.player = new Player();
    gameState.entities.knives = [];
    gameState.entities.enemies = [];
    gameState.entities.gems = [];

    // 初始化飞刀
    updateKnives();

    scoreEl.innerText = '0';
    levelTextEl.innerText = 'Lv.1';
    xpBarEl.style.width = '0%';
    gameOverEl.style.display = 'none';
    
    // 重置输入位置到中心，防止开局乱跑
    inputX = canvas.width / 2;
    inputY = canvas.height / 2;

    loop();
}

function updateKnives() {
    const count = gameState.entities.player.knifeCount;
    gameState.entities.knives = [];
    for(let i=0; i<count; i++) {
        gameState.entities.knives.push(new Knife(gameState.entities.player, i, count));
    }
}

function checkLevelUp() {
    if (gameState.xp >= gameState.xpToNextLevel) {
        gameState.level++;
        gameState.xp = 0;
        gameState.xpToNextLevel = Math.floor(gameState.xpToNextLevel * 1.5);
        
        // 升级奖励：每级加一把刀
        gameState.entities.player.knifeCount++;
        gameState.entities.player.knifeDistance += 5; // 范围变大
        updateKnives();

        levelTextEl.innerText = 'Lv.' + gameState.level;
        
        // 升级特效文字（简化版）
        const p = gameState.entities.player;
        createFloatingText("LEVEL UP!", p.x, p.y - 50, '#ffff00');
    }
    const percent = (gameState.xp / gameState.xpToNextLevel) * 100;
    xpBarEl.style.width = percent + '%';
}

// 简单的浮动文字数组
let floatingTexts = [];
function createFloatingText(text, x, y, color) {
    floatingTexts.push({text, x, y, color, life: 60});
}

function loop() {
    if (!gameState.isRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 背景网格（装饰）
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
    for(let i=0; i<canvas.height; i+=50) { ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); }
    ctx.stroke();

    const player = gameState.entities.player;

    // 1. 生成敌人
    gameState.frames++;
    if (gameState.frames % Math.max(10, CONFIG.spawnRate - gameState.level * 2) === 0) {
        gameState.entities.enemies.push(new Enemy());
    }

    // 2. 更新和绘制玩家
    player.update(inputX, inputY);
    player.draw();

    // 3. 更新和绘制飞刀 & 碰撞检测
    gameState.entities.knives.forEach(knife => {
        knife.draw();
        const kPos = knife.getPosition();
        
        // 检测飞刀打敌人
        for (let i = gameState.entities.enemies.length - 1; i >= 0; i--) {
            const enemy = gameState.entities.enemies[i];
            const dx = kPos.x - enemy.x;
            const dy = kPos.y - enemy.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < knife.radius + enemy.radius) {
                enemy.hp -= knife.damage;
                createFloatingText(knife.damage, enemy.x, enemy.y, '#fff');
                
                // 击退效果
                enemy.x += (dx/dist) * 10;
                enemy.y += (dy/dist) * 10;

                if (enemy.hp <= 0) {
                    // 敌人死亡
                    gameState.entities.enemies.splice(i, 1);
                    gameState.score++;
                    scoreEl.innerText = gameState.score;
                    // 掉落宝石
                    gameState.entities.gems.push(new Gem(enemy.x, enemy.y, 1));
                }
            }
        }
    });

    // 4. 更新和绘制敌人 & 玩家受伤检测
    for (let i = gameState.entities.enemies.length - 1; i >= 0; i--) {
        const enemy = gameState.entities.enemies[i];
        enemy.update(player.x, player.y);
        enemy.draw();

        // 撞玩家
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < player.radius + enemy.radius) {
            player.hp -= 0.5; // 持续伤害
            if (player.hp <= 0) {
                endGame();
            }
        }
    }

    // 5. 更新和绘制宝石
    for (let i = gameState.entities.gems.length - 1; i >= 0; i--) {
        const gem = gameState.entities.gems[i];
        gem.update(player.x, player.y);
        gem.draw();

        const dx = player.x - gem.x;
        const dy = player.y - gem.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < player.radius + gem.radius) {
            gameState.entities.gems.splice(i, 1);
            gameState.xp += gem.value;
            checkLevelUp();
        }
    }

    // 6. 绘制浮动文字
    for (let i = floatingTexts.length -
