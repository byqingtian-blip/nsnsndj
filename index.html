<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>商业级旋转飞刀割草</title>
<style>
  body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; color: #fff; text-shadow: 2px 2px 4px #000; font-size: 18px; display: flex; justify-content: space-between; pointer-events: none; }
  #bossBar { position: absolute; top: 60px; left: 10%; width: 80%; height: 15px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 10px; z-index: 10; display: none; overflow: hidden; }
  #bossHp { height: 100%; background: #f00; width: 100%; transition: width 0.2s; }
  .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; text-align: center; background: rgba(0,0,0,0.85); padding: 30px; border-radius: 15px; color: #fff; }
  button { padding: 15px 40px; font-size: 22px; background: #ff4400; color: #fff; border: none; border-radius: 10px; margin-top: 20px; pointer-events: auto; }
</style>
</head>
<body>
<div id="ui">
  <div>HP:<span id="hp">5</span> | 分数:<span id="score">0</span></div>
  <div>连击:<span id="combo">0</span><br>时间:<span id="time">0:00</span></div>
</div>
<div id="bossBar"><div id="bossHp"></div></div>
<canvas id="game"></canvas>
<div id="startPanel" class="panel"><h1>旋转飞刀割草</h1><button id="startBtn">开始游戏</button></div>
<div id="overPanel" class="panel" style="display:none"><h1>游戏结束</h1><p>分数: <span id="finalScore">0</span></p><button id="restartBtn">重新开始</button></div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const uiHp = document.getElementById('hp'), uiScore = document.getElementById('score'), uiCombo = document.getElementById('combo'), uiTime = document.getElementById('time');
const bossBar = document.getElementById('bossBar'), bossHpBar = document.getElementById('bossHp');
const startPanel = document.getElementById('startPanel'), overPanel = document.getElementById('overPanel');

let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const imgs = {};
['bg','hero','knife','monster','monster2','boss','boss2','effect'].forEach(k=>{
  imgs[k] = new Image(); imgs[k].src = k+'.jpg';
  imgs[k].onload = ()=> removeWhite(imgs[k]);
});

function removeWhite(img) {
  try {
    const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
    const cx = c.getContext('2d'); cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0,0,c.width,c.height);
    for(let i=0;i<d.data.length;i+=4) {
      if(d.data[i]>240 && d.data[i+1]>240 && d.data[i+2]>240) d.data[i+3]=0;
    }
    cx.putImageData(d,0,0); img.src = c.toDataURL();
  } catch(e) {}
}

let state = { running:false, hp:5, score:0, combo:0, time:0, knives:[], enemies:[], particles:[], bgY:0, hero:{x:0,y:0}, boss:null, lastSpawn:0 };

function reset() {
  state = { running:true, hp:5, score:0, combo:0, time:0, knives:[], enemies:[], particles:[], bgY:0, hero:{x:W/2,y:H-80}, boss:null, lastSpawn:0 };
  uiHp.textContent = state.hp; uiScore.textContent = state.score; uiCombo.textContent = state.combo;
  bossBar.style.display = 'none'; startPanel.style.display = 'none'; overPanel.style.display = 'none';
  for(let i=0;i<3;i++) state.knives.push({angle:i*(Math.PI*2/3), r:45});
}

function spawnEnemy() {
  const isBoss = state.time > 30 && Math.random() < 0.05 && !state.boss;
  const x = Math.random()*(W-60)+30;
  if(isBoss) {
    state.boss = {x:W/2, y:-100, hp:500, maxHp:500, type:Math.random()>0.5?2:1};
    bossBar.style.display = 'block'; bossHpBar.style.width = '100%';
  } else {
    state.enemies.push({x, y:-50, hp:1, type:Math.random()>0.5?2:1});
  }
}

function explode(x, y) {
  for(let i=0;i<8;i++) state.particles.push({x, y, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, life:20});
}

function update(dt) {
  if(!state.running) return;
  state.time += dt/1000; uiTime.textContent = Math.floor(state.time/60)+':'+String(Math.floor(state.time%60)).padStart(2,'0');
  
  state.bgY = (state.bgY + dt*0.1) % H;
  
  if(state.hero.targetX !== undefined) {
    state.hero.x += (state.hero.targetX - state.hero.x) * 0.2;
    state.hero.y += (state.hero.targetY - state.hero.y) * 0.2;
  }
  
  state.knives.forEach(k=> k.angle += dt*0.005);
  
  if(Date.now() - state.lastSpawn > 800) { spawnEnemy(); state.lastSpawn = Date.now(); }
  
  state.enemies.forEach(e=> e.y += dt*0.1);
  state.enemies = state.enemies.filter(e=> e.y < H+50);
  
  if(state.boss) {
    state.boss.y += dt*0.03;
    if(Math.abs(state.boss.x - state.hero.x) < 60 && Math.abs(state.boss.y - state.hero.y) < 60) {
      state.hp--; uiHp.textContent = state.hp; state.boss.x += 100;
      if(state.hp<=0) gameOver();
    }
  }
  
  state.knives.forEach(k=>{
    const kx = state.hero.x + Math.cos(k.angle)*k.r;
    const ky = state.hero.y + Math.sin(k.angle)*k.r;
    state.enemies.forEach(e=>{
      if(Math.abs(kx-e.x)<40 && Math.abs(ky-e.y)<40) {
        e.hp--; explode(e.x, e.y);
        if(e.hp<=0) { state.score+=10; state.combo++; uiScore.textContent=state.score; uiCombo.textContent=state.combo; }
      }
    });
    if(state.boss && Math.abs(kx-state.boss.x)<70 && Math.abs(ky-state.boss.y)<70) {
      state.boss.hp-=5; explode(state.boss.x, state.boss.y);
      if(state.boss.hp<=0) { state.score+=100; state.combo++; uiScore.textContent=state.score; state.boss=null; bossBar.style.display='none'; }
      else bossHpBar.style.width = (state.boss.hp/state.boss.maxHp*100)+'%';
    }
  });
  
  state.enemies = state.enemies.filter(e=> e.hp>0);
  state.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;});
  state.particles = state.particles.filter(p=>p.life>0);
}

function draw() {
  ctx.clearRect(0,0,W,H);
  if(imgs.bg.complete) {
    ctx.drawImage(imgs.bg, 0, state.bgY, W, H);
    ctx.drawImage(imgs.bg, 0, state.bgY-H, W, H);
  }
  
  state.enemies.forEach(e=>{
    const img = e.type==1?imgs.monster:imgs.monster2;
    if(img.complete) ctx.drawImage(img, e.x-25, e.y-25, 50, 50);
  });
  
  if(state.boss && imgs.boss.complete) {
    const bImg = state.boss.type==1?imgs.boss:imgs.boss2;
    ctx.drawImage(bImg, state.boss.x-50, state.boss.y-50, 100, 100);
  }
  
  if(imgs.hero.complete) ctx.drawImage(imgs.hero, state.hero.x-30, state.hero.y-30, 60, 60);
  
  state.knives.forEach(k=>{
    const kx = state.hero.x + Math.cos(k.angle)*k.r;
    const ky = state.hero.y + Math.sin(k.angle)*k.r;
    ctx.save(); ctx.translate(kx, ky); ctx.rotate(k.angle);
    if(imgs.knife.complete) ctx.drawImage(imgs.knife, -15, -15, 30, 30);
    ctx.restore();
  });
  
  state.particles.forEach(p=>{
    if(imgs.effect.complete) ctx.drawImage(imgs.effect, p.x-30, p.y-30, 60, 60);
  });
}

let lastT = 0;
function loop(t) {
  const dt = Math.min(t-lastT, 50); lastT = t;
  if(state.running) update(dt);
  draw();
  requestAnimationFrame(loop);
}

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  const touch = e.changedTouches[0];
  state.hero.targetX = touch.clientX; state.hero.targetY = touch.clientY;
});
canvas.addEventListener('mousemove', e=>{
  state.hero.targetX = e.clientX; state.hero.targetY = e.clientY;
});

function gameOver() {
  state.running = false;
  document.getElementById('finalScore').textContent = state.score;
  overPanel.style.display = 'block';
}

document.getElementById('startBtn').addEventListener('click', reset);
document.getElementById('restartBtn').addEventListener('click', reset);

requestAnimationFrame(loop);
</script>
</body>
</html>
