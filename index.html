<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>转刀割草 - 修复版</title>
    <style>
        /* 核心修复：确保画布占满全屏且在最上层 */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #222; 
            touch-action: none; /* 禁止浏览器默认的下拉刷新行为 */
        }
        canvas { 
            display: block; 
            position: absolute; 
            top: 0; left: 0; 
            z-index: 1; /* 保证画布在最底层 */
        }
        
        /* UI层必须在画布上面 */
        #ui-layer { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 10; pointer-events: none; /* 让点击穿透UI传给Canvas */
            font-family: 'Arial', sans-serif;
        }

        .hud-top { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .xp-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 15px; background: #333; border-bottom: 2px solid #000; }
        .xp-bar { height: 100%; background: linear-gradient(90deg, #00ff00, #adff2f); width: 0%; transition: width 0.2s; }
        #level-text { position: absolute; top: 20px; right: 20px; color: yellow; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }

        /* 游戏结束弹窗需要能点击 */
        #game-over { 
            display: none; 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 20; pointer-events: auto; /* 允许点击按钮 */
            flex-direction: column; justify-content: center; align-items: center;
        }
        
        h1 { color: white; font-size: 40px; margin-bottom: 10px; text-shadow: 3px 3px 0 #000; }
        p { color: #ddd; font-size: 20px; margin-bottom: 30px; }
        
        button { 
            padding: 15px 40px; font-size: 24px; 
            background: #ff9900; border: 4px solid #fff; border-radius: 50px; 
            cursor: pointer; color: white; font-weight: bold; 
            box-shadow: 0 6px 0 #cc7a00;
            transition: transform 0.1s;
        }
        button:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc7a00; }
    </style>
</head>
<body>

    <!-- 游戏画布 -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI 层 -->
    <div id="ui-layer">
        <div class="xp-bar-container"><div class="xp-bar" id="xpBar"></div></div>
        <div class="hud-top">击杀: <span id="score">0</span></div>
        <div id="level-text">Lv.1</div>
    </div>

    <!-- 游戏结束弹窗 -->
    <div id="game-over">
        <h1>胜败乃兵家常事</h1>
        <p>最终存活等级: <span id="final-level" style="color:yellow; font-weight:bold;">1</span></p>
        <button onclick="restartGame()">再试一次</button>
    </div>

<script>
/**
 * 修复版逻辑：
 * 1. 增强触摸事件监听 (Touch & Mouse)
 * 2. 确保 Canvas 尺寸实时适配
 * 3. 增加简单的打击感（震动效果模拟）
 */

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// UI 元素
const scoreEl = document.getElementById('score');
const xpBarEl = document.getElementById('xpBar');
const levelTextEl = document.getElementById('level-text');
const gameOverEl = document.getElementById('game-over');
const finalLevelEl = document.getElementById('final-level');

// 游戏配置
const CONFIG = {
    playerSpeed: 0.15, // 移动平滑度 (0-1)
    baseKnifeSpeed: 0.1, 
    spawnRate: 50, // 敌人生成间隔帧数
};

// 全局状态
let gameState = {
    isRunning: true,
    score: 0,
    level: 1,
    xp: 0,
    xpToNextLevel: 10,
    frames: 0,
    width: 0,
    height: 0,
    entities: { player: null, knives: [], enemies: [], gems: [] }
};

// 目标位置（手指点击的位置）
let targetPos = { x: 0, y: 0 };

// --- 初始化与调整大小 ---
function resize() {
    gameState.width = window.innerWidth;
    gameState.height = window.innerHeight;
    canvas.width = gameState.width;
    canvas.height = gameState.height;
    
    // 如果游戏还没开始，把目标位置设为中心
    if (!gameState.entities.player) {
        targetPos.x = gameState.width / 2;
        targetPos.y = gameState.height / 2;
    }
}
window.addEventListener('resize', resize);
resize();

// --- 输入控制 (修复核心) ---
function handleInput(x, y) {
    targetPos.x = x;
    targetPos.y = y;
}

// 触摸事件
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); // 防止滚动
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});

// 鼠标事件 (PC调试用)
canvas.addEventListener('mousedown', (e) => {
    handleInput(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', (e) => {
    if(e.buttons === 1) handleInput(e.clientX, e.clientY);
});


// --- 类定义 ---

class Player {
    constructor() {
        this.x = gameState.width / 2;
        this.y = gameState.height / 2;
        this.radius = 20;
        this.hp = 100;
        this.maxHp = 100;
        // 武器属性
        this.knifeCount = 3;
        this.knifeDistance = 90;
        this.angleOffset = 0;
    }

    update() {
        // 简单的缓动跟随算法
        const dx = targetPos.x - this.x;
        const dy = targetPos.y - this.y;
        
        // 只有距离远才移动，防止抖动
        if (Math.sqrt(dx*dx + dy*dy) > 5) {
            this.x += dx * CONFIG.playerSpeed;
            this.y += dy * CONFIG.playerSpeed;
        }

        // 边界限制
        this.x = Math.max(this.radius, Math.min(gameState.width - this.radius, this.x));
        this.y = Math.max(this.radius, Math.min(gameState.height - this.radius, this.y));

        // 旋转武器
        this.angleOffset += CONFIG.baseKnifeSpeed + (gameState.level * 0.01);
    }

    draw() {
        // 绘制玩家主体
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#3498db';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.closePath();

        // 绘制血条背景
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(this.x - 25, this.y + 35, 50, 8);
        // 绘制当前血量
        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = hpPercent > 0.5 ? '#2ecc71' : '#e74c3c';
        ctx.fillRect(this.x - 24, this.y + 36, 48 * hpPercent, 6);
    }
}

class Knife {
    constructor(owner, index, total) {
        this.owner = owner;
        this.index = index;
        this.total = total;
        this.damage = 15;
    }

    getPosition() {
        const angle = this.owner.angleOffset + (Math.PI * 2 / this.total) * this.index;
        return {
            x: this.owner.x + Math.cos(angle) * this.owner.knifeDistance,
            y: this.owner.y + Math.sin(angle) * this.owner.knifeDistance
        };
    }

    draw() {
        const pos = this.getPosition();
        ctx.save();
        ctx.translate(pos.x, pos.y);
        // 计算刀尖朝向
        const angle = this.owner.angleOffset + (Math.PI * 2 / this.total) * this.index;
        ctx.rotate(angle);
        
        // 绘制飞刀形状
        ctx.beginPath();
        ctx.moveTo(15, 0); // 刀尖
        ctx.lineTo(-10, 8);
        ctx.lineTo(-5, 0);
        ctx.lineTo(-10, -8);
        ctx.closePath();
        ctx.fillStyle = '#f1c40f'; 
        ctx.fill();
        ctx.shadowBlur = 10;
        ctx.shadowColor = "orange";
        
        ctx.restore();
    }
}

class Enemy {
    constructor() {
        // 边缘生成逻辑
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) { this.x = Math.random() * gameState.width; this.y = -30; } // Top
        else if (edge === 1) { this.x = gameState.width + 30; this.y = Math.random() * gameState.height; } // Right
        else if (edge === 2) { this.x = Math.random() * gameState.width; this.y = gameState.height + 30; } // Bottom
        else { this.x = -30; this.y = Math.random() * gameState.height; } // Left
        
        this.radius = 18;
        this.speed = 1.5 + (gameState.level * 0.15); 
        this.hp = 30 + (gameState.level * 10);
        this.color = '#e74c3c';
    }

    update(targetX, targetY) {
        const dx = targetX - this.x;
        const dy = targetY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist > 0) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#c0392b';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.closePath();
    }
}

class Gem {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 8;
        this.magnetized = false;
    }

    update(playerX, playerY) {
        const dx = playerX - this.x;
        const dy = playerY - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // 磁吸范围
        if (dist < 150) this.magnetized = true;

        if (this.magnetized) {
            this.x += (dx / dist) * 12; 
            this.y += (dy / dist) * 12;
        }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#2ecc71'; 
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.closePath();
    }
}

// --- 游戏主循环 ---

function initGame() {
    gameState.isRunning = true;
    gameState.score = 0;
    gameState.level = 1;
    gameState.xp = 0;
    gameState.xpToNextLevel = 10;
    gameState.frames = 0;
    
    gameState.entities.player = new Player();
    gameState.entities.knives = [];
    gameState.entities.enemies = [];
    gameState.entities.gems = [];
    
    // 重置目标点为玩家当前位置，防止开局乱跑
    targetPos.x = gameState.entities.player.x;
    targetPos.y = gameState.entities.player.y;

    updateKnives();
    
    scoreEl.innerText = '0';
    levelTextEl.innerText = 'Lv.1';
    xpBarEl.style.width = '0%';
    gameOverEl.style.display = 'none';

    requestAnimationFrame(loop);
}

function updateKnives() {
    const count = gameState.entities.player.knifeCount;
    gameState.entities.knives = [];
    for(let i=0; i<count; i++) {
        gameState.entities.knives.push(new Knife(gameState.entities.player, i, count));
    }
}

function checkLevelUp() {
    if (gameState.xp >= gameState.xpToNextLevel) {
        gameState.level++;
        gameState.xp = 0;
        gameState.xpToNextLevel = Math.floor(gameState.xpToNextLevel * 1.4);
        
        // 升级奖励：加刀、加范围
        gameState.entities.player.knifeCount++;
        gameState.entities.player.knifeDistance += 8; 
        updateKnives();

        levelTextEl.innerText = 'Lv.' + gameState.level;
        
        // 升级特效（简单闪一下背景）
        document.body.style.backgroundColor = '#444';
        setTimeout(() => document.body.style.backgroundColor = '#222', 100);
    }
    const percent = Math.min(100, (gameState.xp / gameState.xpToNextLevel) * 100);
    xpBarEl.style.width = percent + '%';
}

function loop() {
    if (!gameState.isRunning) return;

    ctx.clearRect(0, 0, gameState.width, gameState.height);
    
    // 绘制网格背景
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=0; i<gameState.width; i+=100) { ctx.moveTo(i,0); ctx.lineTo(i,gameState.height); }
    for(let i=0; i<gameState.height; i+=100) { ctx.moveTo(0,i); ctx.lineTo(gameState.width,i); }
    ctx.stroke();

    const player = gameState.entities.player;

    // 1. 生成敌人 (难度随时间增加)
    gameState.frames++;
    let currentSpawnRate = Math.max(10, CONFIG.spawnRate - gameState.level * 2);
    if (gameState.frames % currentSpawnRate === 0) {
        gameState.entities.enemies.push(new Enemy());
    }

    // 2. 更新玩家
    player.update();
    player.draw();

    // 3. 更新飞刀 & 碰撞检测
    gameState.entities.knives.forEach(knife => {
        knife.draw();
        const kPos = knife.getPosition();
        
        // 遍历所有敌人检测碰撞
        for (let i = gameState.entities.enemies.length - 1; i >= 0; i--) {
            const enemy = gameState.entities.enemies[i];
            const dx = k
