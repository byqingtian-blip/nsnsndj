
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旋转飞刀割草</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; touch-action: none; }
#gameContainer { width: 100vw; height: 100vh; position: relative; overflow: hidden; background: url('bg.jpg') no-repeat center/cover; }
.entity { position: absolute; user-select: none; }
#hero { width: 60px; height: 60px; bottom: 20px; left: 50%; transform: translateX(-50%); }
.monster { width: 50px; height: 50px; }
.boss { width: 100px; height: 100px; }
.weapon { width: 20px; height: 20px; }
.effect { width: 40px; height: 40px; pointer-events: none; }
#scoreBoard { position: absolute; top: 10px; left: 10px; font-size: 20px; color: #fff; z-index: 100; text-shadow: 1px 1px 2px #000; font-family: Arial, sans-serif; }
#startBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; font-size: 24px; background: #ff4400; color: #fff; border: none; border-radius: 10px; z-index: 200; font-family: Arial, sans-serif; }
</style>
</head>
<body>
<div id="gameContainer">
    <div id="scoreBoard">分数: 0</div>
    <img src="hero.jpg" id="hero" class="entity">
    <button id="startBtn">开始游戏</button>
</div>

<script>
var container = document.getElementById('gameContainer');
var hero = document.getElementById('hero');
var scoreBoard = document.getElementById('scoreBoard');
var startBtn = document.getElementById('startBtn');

var score = 0;
var isPlaying = false;
var monsters = [];
var weapons = [];
var shootTimer = null;
var spawnTimer = null;
var animId = null;

container.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (!isPlaying) return;
    var touch = e.touches[0];
    var x = touch.clientX - 30;
    if (x < 0) x = 0;
    if (x > window.innerWidth - 60) x = window.innerWidth - 60;
    hero.style.left = x + 'px';
});

container.addEventListener('mousemove', function(e) {
    if (!isPlaying) return;
    var x = e.clientX - 30;
    if (x < 0) x = 0;
    if (x > window.innerWidth - 60) x = window.innerWidth - 60;
    hero.style.left = x + 'px';
});

function shoot() {
    if (!isPlaying) return;
    var knife = document.createElement('img');
    knife.src = 'knife.jpg';
    knife.className = 'weapon entity';
    var hx = parseInt(hero.style.left) || (window.innerWidth / 2 - 30);
    knife.style.left = (hx + 20) + 'px';
    knife.style.bottom = '80px';
    container.appendChild(knife);
    weapons.push({ el: knife, y: 80 });
}

function spawnMonster() {
    if (!isPlaying) return;
    var isBoss = Math.random() > 0.9;
    var m = document.createElement('img');
    m.src = isBoss ? (Math.random() > 0.5 ? 'boss.jpg' : 'boss2.jpg') : (Math.random() > 0.5 ? 'monster.jpg' : 'monster2.jpg');
    m.className = isBoss ? 'boss entity' : 'monster entity';
    m.style.left = (Math.random() * (window.innerWidth - (isBoss ? 100 : 50))) + 'px';
    m.style.top = '-100px';
    container.appendChild(m);
    monsters.push({ el: m, y: -100, boss: isBoss });
}

function update() {
    if (!isPlaying) return;

    for (var i = weapons.length - 1; i >= 0; i--) {
        weapons[i].y += 8;
        weapons[i].el.style.bottom = weapons[i].y + 'px';
        if (weapons[i].y > window.innerHeight) {
            weapons[i].el.remove();
            weapons.splice(i, 1);
        }
    }

    for (var j = monsters.length - 1; j >= 0; j--) {
        monsters[j].y += monsters[j].boss ? 1.5 : 3;
        monsters[j].el.style.top = monsters[j].y + 'px';

        var mx = parseInt(monsters[j].el.style.left) || 0;
        var my = monsters[j].y;

        for (var k = weapons.length - 1; k >= 0; k--) {
            var wx = parseInt(weapons[k].el.style.left) || 0;
            var wy = window.innerHeight - weapons[k].y - 20;

            if (Math.abs(my - wy) < 50 && Math.abs(mx - wx) < 50) {
                var eff = document.createElement('img');
                eff.src = 'effect.jpg';
                eff.className = 'effect entity';
                eff.style.left = mx + 'px';
                eff.style.top = my + 'px';
                container.appendChild(eff);
                setTimeout(function(e) { return function() { e.remove(); }; }(eff), 300);

                monsters[j].el.remove();
                var wasBoss = monsters[j].boss;
                monsters.splice(j, 1);
                weapons[k].el.remove();
                weapons.splice(k, 1);

                score += wasBoss ? 50 : 10;
                scoreBoard.innerText = '分数: ' + score;
                break;
            }
        }

        if (monsters[j] && monsters[j].y > window.innerHeight + 100) {
            monsters[j].el.remove();
            monsters.splice(j, 1);
        }
    }

    animId = requestAnimationFrame(update);
}

startBtn.addEventListener('click', function() {
    isPlaying = true;
    startBtn.style.display = 'none';
    score = 0;
    scoreBoard.innerText = '分数: ' + score;
    shootTimer = setInterval(shoot, 500);
    spawnTimer = setInterval(spawnMonster, 1500);
    update();
});
</script>
</body>
</html>
